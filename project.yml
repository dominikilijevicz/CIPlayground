name: CIPlayground
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "26.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  CIPlayground:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: CI Playground
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ciplayground
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"

  CIPlaygroundTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: CIPlayground
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ciplayground.tests
        GENERATE_INFOPLIST_FILE: YES

  CIPlaygroundUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: CIPlayground
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ciplayground.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: CIPlayground

schemes:
  CIPlayground:
    build:
      targets:
        CIPlayground: all
        CIPlaygroundTests: [test]
        CIPlaygroundUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - CIPlayground
      targets:
        - CIPlaygroundTests
        - CIPlaygroundUITests
    archive:
      config: Release
